[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openenv-harvest_rush_env"
version = "0.1.0"
description = "Harvest Rush (train) as an OpenEnv environment: one priced contact decision per episode, programmatic reward"
requires-python = ">=3.11"
dependencies = [
    # Core OpenEnv runtime (provides FastAPI server + HTTP client types)
    # install from github
    # "openenv @ git+https://github.com/huggingface/OpenEnv.git",
    "openenv>=0.2.2",
    # the environment logic and reward (pulls the Harvest Rush engine with it)
    "harvest-rush-train @ git+https://github.com/CompassionML/harvest-rush-train@main",
    # Environment-specific dependencies
    # Add all dependencies needed for your environment here
    # Examples:
    # "numpy>=1.19.0",
    # "torch>=2.0.0",
    # "gymnasium>=0.29.0",
    # "openspiel>=1.0.0",
    # "smolagents>=1.22.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
# Server entry point - enables running via: uv run --project . server
# or: python -m harvest_rush_env.server.app
server = "harvest_rush_env.server.app:main"

[tool.setuptools]
include-package-data = true
packages = ["harvest_rush_env", "harvest_rush_env.server"]
package-dir = { "harvest_rush_env" = ".", "harvest_rush_env.server" = "server" }