name: ci
on:
  push:
    branches: ["feature/**", "main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,eval]"
          # Until CompassionML/harvestbench#3 (the packaging patch) is merged, main
          # installs nothing importable, so take the engine from the patch branch.
          python -c "import harvest" 2>/dev/null || pip install --force-reinstall --no-deps \
            "harvestbench @ git+https://github.com/CompassionML/harvestbench@feature/declare-package"
          python -c "import harvest, harvest_rush_train; print('engine at', harvest.__file__)"
      - name: Tests
        run: pytest -q
      - name: vf-eval end to end against a fake model server
        env:
          FAKE_KEY: not-a-real-key
        run: |
          python tests/fake_openai_server.py --port 8009 --choice swerve > fake_server.log 2>&1 &
          sleep 2
          vf-eval harvest-rush-train -m fake-model -b http://127.0.0.1:8009/v1 -k FAKE_KEY \
            -n 10 -r 1 -t 64 -a '{"num_train_examples": 30, "num_eval_examples": 30}' 2>&1 | tee vf_eval.log
          grep -q "POST /v1/chat/completions" fake_server.log
          grep -i -E "reward" vf_eval.log | head -5
